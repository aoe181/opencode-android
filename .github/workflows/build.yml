name: Build Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Write signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "keystore bytes: $(wc -c < "$RUNNER_TEMP/release.keystore")"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (R8)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signing certificate
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          KS="$RUNNER_TEMP/release.keystore"
          echo "== 期望证书 =="
          keytool -list -v -keystore "$KS" -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -alias "${{ secrets.SIGNING_KEY_ALIAS }}" 2>/dev/null | grep "SHA256:" | head -1
          echo "== APK 实际证书 =="
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK" 2>/dev/null | grep "SHA-256" | head -1
          # 证书不一致直接失败，避免再发出装不上的包
          EXPECTED=$(keytool -list -v -keystore "$KS" -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" \
            -alias "${{ secrets.SIGNING_KEY_ALIAS }}" 2>/dev/null | grep "SHA256:" | head -1 | awk '{print $2}')
          ACTUAL=$($ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK" 2>/dev/null | grep "SHA-256" | head -1 | awk '{print $2}')
          if [ "$EXPECTED" = "$ACTUAL" ] && [ -n "$EXPECTED" ]; then
            echo "✅ 签名与 keystore 一致"
          else
            echo "❌ 签名不一致（expected=$EXPECTED actual=$ACTUAL）"
            exit 1
          fi

      - name: Report APK size
        run: |
          f=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "### Release APK（预发行）" >> $GITHUB_STEP_SUMMARY
          echo "| 文件 | 大小 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |" >> $GITHUB_STEP_SUMMARY

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-client-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # 打 v* tag 时自动发布为 GitHub Pre-release（预发行）
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            > 预发行版本（pre-release），仅供测试，可能存在缺陷。

            非官方 OpenCode 安卓客户端。安装前请确认服务器可用：

            ```
            OPENCODE_PASSWORD=你的密码 opencode serve --port 4096
            ```
